groups:
  - name: stellarcert_backend_alerts
    rules:
      - alert: BackendHighErrorRate
        expr: |
          (
            sum(rate(http_errors_total[5m]))
            /
            clamp_min(sum(rate(http_requests_total[5m])), 1e-9)
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          service: stellarcert_backend
        annotations:
          summary: "High HTTP error rate on StellarCert backend"
          description: "More than 5% of HTTP requests have returned errors over the last 5 minutes (current value: {{ $value | humanizePercentage }})."

      - alert: BackendHighLatency
        expr: |
          histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 1
        for: 10m
        labels:
          severity: warning
          service: stellarcert_backend
        annotations:
          summary: "High p95 HTTP latency on StellarCert backend"
          description: "95th percentile request latency has exceeded 1s for 10 minutes (current value: {{ $value | humanizeDuration }})."

      - alert: BackendDatabaseDisconnected
        expr: |
          sum(increase(db_connection_status{status="disconnected"}[5m])) > 0
        for: 1m
        labels:
          severity: critical
          service: stellarcert_backend
        annotations:
          summary: "Database connection lost on StellarCert backend"
          description: "The backend recorded database disconnection events in the last 5 minutes."

      - alert: BackendAuthenticationFailureSpike
        expr: |
          sum(rate(authentication_attempts_total{status="failure"}[5m]))
            > 5 * clamp_min(sum(rate(authentication_attempts_total{status="success"}[5m])), 0.1)
        for: 10m
        labels:
          severity: warning
          service: stellarcert_backend
        annotations:
          summary: "Authentication failure spike on StellarCert backend"
          description: "Failed authentication attempts are significantly outpacing successful ones, which may indicate brute-force activity."

      - alert: BackendTargetDown
        expr: up{job="stellarcert_backend"} == 0
        for: 2m
        labels:
          severity: critical
          service: stellarcert_backend
        annotations:
          summary: "StellarCert backend target is down"
          description: "Prometheus cannot scrape the backend metrics endpoint."
