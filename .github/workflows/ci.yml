name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:

# Least privilege: every job in this workflow only needs to read the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      contracts: ${{ steps.filter.outputs.contracts }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
            contracts:
              - 'stellar-contracts/**'
            docker:
              - 'backend/Dockerfile'
              - 'frontend/Dockerfile'
              - 'docker-compose.yml'
              - 'nginx/**'

  conflict-markers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for merge conflict markers
        run: |
          if git grep -nE '^(<{7}|={7}|>{7}|\|{7})( |$)' -- . ':!*.md'; then
            echo "Merge conflict markers found"
            exit 1
          fi

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Security audit
        run: npm run security:audit

  # Case-sensitive filesystems (Linux and every CI runner) resolve import
  # specifiers exactly, so a casing typo that works on macOS/Windows breaks
  # the build - or, for a `React.lazy` route, blanks the page at runtime
  # instead of failing loudly (#744). The check is dependency-free on
  # purpose, so it runs without the frontend install.
  import-case:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check relative import casing
        run: node frontend/scripts/check-import-case.mjs
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Check API route alignment
        run: npm run check:api-routes
      # `npm test` maps to `vitest run` (see frontend/package.json) so the
      # 16 existing src/**/*.test.ts[x] suites are actually executed here.
      - name: Test frontend
        run: npm test
      - name: Build frontend
        run: npm run build

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 26 only: NestJS v12 (@nestjs/* family) ships pure ESM with no
        # CJS build, so Jest's require(esm) support is the only way to load
        # it from this project's CommonJS test files - and that support needs
        # Node >=24.9 (vm.SourceTextModule.prototype.hasAsyncGraph). Node 20/22
        # can't run this test suite at all once NestJS is on v12, and
        # production's backend/Dockerfile is already pinned to node:26-alpine,
        # so 20/22 were testing a configuration nothing actually runs.
        node-version: [26]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Lint backend
        run: npm run lint -- --max-warnings 0
      - name: Typecheck backend
        run: npm run typecheck
      - name: Build backend
        run: npm run build
      - name: Test backend with coverage
        run: npm run test:cov -- --ci

  # The unit suite above never imports AppModule end to end, so the
  # test/*.e2e-spec.ts suites (auth, users, certificate manager, versioning)
  # were dead code. They boot a real Nest application, which needs PostgreSQL
  # and the Redis instance backing BullMQ.
  backend-e2e:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # #1374: pinned to the exact same patch version as docker-compose.yml
        # and docker-compose.dev.yml (POSTGRES_IMAGE there) - service
        # containers here can't read the repo's .env, so it's hardcoded.
        image: postgres:15.19-alpine
        env:
          POSTGRES_USER: stellarwave_user
          POSTGRES_PASSWORD: stellarwave_password
          POSTGRES_DB: stellarwave
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stellarwave_user -d stellarwave"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        # #1374: see the matching note on the postgres image above.
        image: redis:7.4.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: 3000
      DB_TYPE: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: stellarwave_user
      DB_PASSWORD: stellarwave_password
      DB_NAME: stellarwave
      # Let TypeORM derive the schema from the entities instead of replaying
      # migrations that are only built for the production image.
      TYPEORM_SYNCHRONIZE: 'true'
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-jwt-secret-not-used-in-production
      JWT_ACCESS_SECRET: ci-only-jwt-secret-not-used-in-production
      JWT_REFRESH_SECRET: ci-only-jwt-secret-not-used-in-production
      JWT_EXPIRES_IN: 24h
      STELLAR_NETWORK: testnet
      STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
      STELLAR_ISSUER_SECRET_KEY: ''
      STELLAR_ISSUER_PUBLIC_KEY: ''
      ALLOWED_ORIGINS: http://localhost:5173
      ENABLE_SENTRY: 'false'
      # No object storage in CI; the files module must not require it to boot.
      STORAGE_REQUIRED: 'false'
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_BUCKET: stellar-cert
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 26 only - see the `backend` job's matrix comment: NestJS v12
          # is pure ESM and Jest's require(esm) support needs Node >=24.9.
          node-version: 26
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Run backend e2e tests
        # The suite passes, but Jest never exits afterwards: the Nest app
        # leaves its Redis and scheduler handles open, so the step sat "in
        # progress" until the 6-hour job timeout. Results (and the non-zero
        # exit on failure) are unchanged; this only ends the process.
        run: npm run test:e2e -- --ci --runInBand --forceExit

  # `backend-e2e` sets TYPEORM_SYNCHRONIZE=true so TypeORM derives the schema
  # from entities, which means the migration files in src/database/migrations
  # (the ones docker-entrypoint.sh runs in every real deployment) were never
  # executed by CI. A broken migration could merge to main and only surface on
  # the first `docker compose up`. Replay them against a throwaway Postgres.
  backend-migrations:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # #1374: pinned to the exact same patch version as docker-compose.yml
        # and docker-compose.dev.yml (POSTGRES_IMAGE there) - service
        # containers here can't read the repo's .env, so it's hardcoded.
        image: postgres:15.19-alpine
        env:
          POSTGRES_USER: stellarwave_user
          POSTGRES_PASSWORD: stellarwave_password
          POSTGRES_DB: stellarwave
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stellarwave_user -d stellarwave"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DB_TYPE: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: stellarwave_user
      DB_PASSWORD: stellarwave_password
      DB_NAME: stellarwave
      # Migrations, not synchronize: this is the whole point of the job.
      TYPEORM_SYNCHRONIZE: 'false'
      # The DataSource reads these at import time; keep them harmless.
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-jwt-secret-not-used-in-production
      JWT_ACCESS_SECRET: ci-only-jwt-secret-not-used-in-production
      JWT_REFRESH_SECRET: ci-only-jwt-secret-not-used-in-production
      JWT_EXPIRES_IN: 24h
      STELLAR_NETWORK: testnet
      STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
      STELLAR_ISSUER_SECRET_KEY: ''
      STELLAR_ISSUER_PUBLIC_KEY: ''
      ALLOWED_ORIGINS: http://localhost:5173
      ENABLE_SENTRY: 'false'
      STORAGE_REQUIRED: 'false'
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_BUCKET: stellar-cert
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 26 only - see the `backend` job's matrix comment: NestJS v12
          # is pure ESM and Jest's require(esm) support needs Node >=24.9.
          node-version: 26
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Build backend
        run: npm run build
      - name: Run migrations against throwaway Postgres
        # `migration:run` uses the compiled DataSource, so the build above is
        # required. `migration:revert` runs every down() in reverse order,
        # catching down-incompatible renames that would otherwise only fail
        # during a rollback in production.
        run: |
          npx typeorm migration:run -t each -d dist/database/data-source.js
          npx typeorm migration:revert -t each -d dist/database/data-source.js
          npx typeorm migration:run -t each -d dist/database/data-source.js

  # Nothing built the images or parsed nginx.conf, so a broken Dockerfile or
  # nginx directive could reach a release. Build every documented target.
  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build --target production -t stellarcert-backend:ci ./backend
      - name: Build frontend development image
        run: docker build --target development -t stellarcert-frontend:dev ./frontend
      - name: Build frontend production image
        run: docker build --target production -t stellarcert-frontend:prod ./frontend
      - name: Validate nginx configuration
        run: |
          # nginx -t parses ssl_certificate directives, so the TLS files that
          # production mounts must exist even for a syntax check.
          mkdir -p nginx/ssl
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout nginx/ssl/key.pem -out nginx/ssl/cert.pem -subj "/CN=localhost"
          docker run --rm \
            -v "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/nginx/ssl:/etc/nginx/ssl:ro" \
            nginx:alpine nginx -t
      # Building an image proves nothing about whether it boots. Start the
      # real stack and require the backend to report healthy, so a broken
      # entrypoint, missing runtime file, or crash-looping container fails CI.
      - name: Start stack with docker compose
        run: |
          mkdir -p nginx/ssl
          if [ ! -f nginx/ssl/cert.pem ]; then
            openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
              -keyout nginx/ssl/key.pem -out nginx/ssl/cert.pem -subj "/CN=localhost"
          fi
          # docker-compose.yml requires every ${VAR:?} below to come from
          # .env; these are the same safe, documented throwaway values
          # .env.example ships for local development, not real secrets.
          cp .env.example .env
          docker compose up -d --build
      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' \
              "$(docker compose ps -q backend)" 2>/dev/null || echo "starting")
            if [ "$status" = "healthy" ]; then
              echo "Backend is healthy"
              exit 0
            fi
            if [ "$status" = "unhealthy" ] || [ "$(docker compose ps -q backend | xargs -r docker inspect -f '{{.State.Status}}')" = "exited" ]; then
              echo "Backend failed to start"
              docker compose logs backend
              exit 1
            fi
            sleep 5
          done
          echo "Backend never reported healthy"
          docker compose logs backend
          exit 1
      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down stack
        if: always()
        run: docker compose down -v

  # No job previously exercised the real user journey across the stack
  # (issue -> verify -> transfer). Bring up the full docker compose stack and
  # drive it with a smoke-level Playwright suite, so cross-service wiring
  # breaks loudly in CI instead of in production.
  e2e-smoke:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install e2e dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Configure stack environment
        # docker-compose.yml requires every ${VAR:?} below to come from .env;
        # these are the same safe, documented throwaway values .env.example
        # ships for local development, not real secrets.
        run: cp .env.example .env
      - name: Start full stack via docker compose
        run: docker compose up -d --build --wait
      - name: Run cross-stack smoke suite (issue -> verify -> transfer)
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:5173
          E2E_API_URL: http://localhost:3000/api/v1
          E2E_DB_PORT: 5433
        run: npx playwright test --project=cross-stack-smoke
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt
      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-logs.txt
          retention-days: 7
      - name: Tear down stack
        if: always()
        run: docker compose down -v

  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stellar-contracts
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: stellar-contracts
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        # Deny all lints except `deprecated`: the contract still uses the
        # soroban-sdk event API (env.events().publish), whose migration to the
        # #[contractevent] macro is tracked separately.
        run: cargo clippy --all-targets -- -D warnings -A deprecated
      - name: Install wasm target
        run: rustup target add wasm32v1-none
      # The official prebuilt binary: compiling it with `cargo install` takes
      # many minutes, and with current Rust its pinned ethnum 1.5.2 fails to
      # build (E0512).
      - name: Install Stellar CLI
        run: |
          curl -fsSL https://github.com/stellar/stellar-cli/releases/download/v25.2.0/stellar-cli-25.2.0-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$HOME/.cargo/bin" stellar
          stellar --version
      # One WASM per contract (they share exported function names, so each is
      # built with its own feature): target/contracts/<contract>.wasm, which
      # is what deploy-contracts.sh ships.
      - name: Build contracts
        run: ./build-contracts.sh
      - name: Test contracts
        run: cargo test
